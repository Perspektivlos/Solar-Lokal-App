apiVersion: 1

# Auto-Provisioning der InfluxDB-Datasource (Flux) für das Solar-Dashboard.
# Werte kommen aus Umgebungsvariablen (siehe docker-compose.yml):
#   INFLUX_URL, INFLUX_ORG, INFLUX_TOKEN, INFLUX_BUCKET
datasources:
  - name: InfluxDB Solar
    uid: influxdb-solar
    type: influxdb
    access: proxy
    url: ${INFLUX_URL}
    isDefault: true
    jsonData:
      version: Flux
      organization: ${INFLUX_ORG}
      defaultBucket: ${INFLUX_BUCKET}
      tlsSkipVerify: true
    secureJsonData:
      token: ${INFLUX_TOKEN}
    editable: false
